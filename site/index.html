<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Thinking Ops</title>
<style>
:root{--bg:#f2f4f3;--sf:#fff;--sf2:#e9edeb;--ln:#d5dbd8;--fg:#13201c;--mu:#5b6b66;--ac:#0d6b5b;
--run:#1d5fd1;--blk:#b83d0b;--que:#9a6a05;--don:#1b7a3d;--runb:#e3ecfb;--blkb:#fbe8e0;--queb:#f9efd6;--donb:#def2e4;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--sf:#17211e;--sf2:#1e2b27;--ln:#2b3a35;--fg:#e6efec;--mu:#93a39d;--ac:#3fbfa6;
--run:#7fa8f2;--blk:#f0875c;--que:#e0b24f;--don:#6fcf8d;--runb:#172a4a;--blkb:#3a1f14;--queb:#33290f;--donb:#14301f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 8px}
.sub{color:var(--mu);font-size:13px;margin:4px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font:500 26px ui-monospace,Menlo,monospace}.kpi span{font-size:12px;color:var(--mu)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;min-width:0}
.need{border-left:3px solid var(--blk);background:var(--blkb);padding:8px 10px;margin-bottom:8px;border-radius:0 6px 6px 0;overflow-wrap:anywhere}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--sf2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow-wrap:anywhere}
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.project-card .project-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.project-card .project-head h3{flex:1;min-width:180px}
.project-card .project-meta{font-size:12px;color:var(--mu);overflow-wrap:anywhere}
.active{color:var(--run);background:var(--runb)}.paused{color:var(--que);background:var(--queb)}
.card h3{font-size:15px;margin:0 0 4px}.card p{margin:0 0 4px;font-size:13px;color:var(--mu)}
.bar{height:5px;background:var(--sf2);border-radius:3px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.pill{font:600 11px ui-monospace,monospace;padding:2px 8px;border-radius:10px;text-transform:uppercase}
.running{color:var(--run);background:var(--runb)}.blocked{color:var(--blk);background:var(--blkb)}.queued{color:var(--que);background:var(--queb)}.done{color:var(--don);background:var(--donb)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th{text-align:left;font-size:12px;color:var(--mu);padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:8px;border-bottom:1px solid var(--ln);font-size:14px;vertical-align:top}td.n{font-family:ui-monospace,monospace}td.s{font:600 14px ui-monospace,monospace;color:var(--ac)}
ul{margin:0;padding-left:18px}.empty{color:var(--mu)}
</style>
</head>
<body>
<main>
  <div><h1>Thinking Ops</h1><p class="sub" id="gen">Loading…</p></div>
  <div class="kpis" id="kpis"></div>
  <div class="panel"><h2>Needs you</h2><div id="need"></div></div>
  <div class="panel"><h2>Projects</h2><div class="projects" id="projects"></div></div>
  <div class="panel"><h2>Agents</h2><div class="board" id="board"></div></div>
  <div class="panel"><h2>Idea ranking · impact × confidence ÷ effort</h2><div class="tw"><table><thead><tr><th>Idea</th><th>Area</th><th>I</th><th>C</th><th>E</th><th>Score</th></tr></thead><tbody id="ideas"></tbody></table></div></div>
  <div class="panel"><h2>Task queue</h2><div class="tw"><table><thead><tr><th>Task</th><th>Status</th><th>Assignee</th><th>Agent</th></tr></thead><tbody id="tasks"></tbody></table></div></div>
  <div class="panel"><h2>Decision log</h2><ul id="dec"></ul></div>
</main>
<script>
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
fetch('data.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  var by={queued:[],running:[],blocked:[],done:[]};d.agents.forEach(function(a){(by[a.status]||by.queued).push(a)});
  var open=d.ideas.filter(function(i){return i.status==='open'}).sort(function(a,b){return b.score-a.score});
  var review=d.tasks.filter(function(t){return t.status==='review'});
  document.getElementById('gen').textContent='Generated from the repo on '+new Date(d.generated).toLocaleString();
  [['Running',by.running.length],['Blocked',by.blocked.length],['Queued',by.queued.length],['Done',by.done.length],['Open ideas',open.length],['In review',review.length]].forEach(function(k){
    var c=el('div','kpi');c.appendChild(el('b',null,k[1]));c.appendChild(el('span',null,k[0]));document.getElementById('kpis').appendChild(c)});
  var need=document.getElementById('need'),n=0;
  by.blocked.forEach(function(a){n++;var e=el('div','need');e.appendChild(el('b',null,a.name+' (blocked)'));e.appendChild(el('div',null,a.blocker));need.appendChild(e)});
  review.forEach(function(t){n++;need.appendChild(el('div','need',t.title+' is waiting for your review'))});
  if(!n)need.appendChild(el('div','empty','Nothing waiting on you.'));
  var ps=document.getElementById('projects');
  var agentNames={},ideaNames={};
  d.agents.forEach(function(a){agentNames[a.id]=a.name});
  d.ideas.forEach(function(i){ideaNames[i.id]=i.title});
  function names(csv,known){return (csv||'').split(',').map(function(id){id=id.trim();return known[id]||id}).filter(Boolean).join(', ')||'None'}
  (d.projects||[]).forEach(function(p){
    var c=el('div','card project-card'),h=el('div','project-head');
    h.appendChild(el('h3',null,p.name));h.appendChild(el('span','pill '+p.status,p.status));c.appendChild(h);
    c.appendChild(el('p',null,p.goal));
    c.appendChild(el('div','project-meta','Path: '+(p.path||'Not linked')));
    if(p.repo)c.appendChild(el('div','project-meta','Repo: '+p.repo));
    c.appendChild(el('div','project-meta','Next: '+(p.next||'Not set')));
    c.appendChild(el('div','project-meta','Agents: '+names(p.linked_agents,agentNames)));
    c.appendChild(el('div','project-meta','Ideas: '+names(p.linked_ideas,ideaNames)));
    ps.appendChild(c)
  });
  if(!(d.projects||[]).length)ps.appendChild(el('div','empty','No projects yet.'));
  var b=document.getElementById('board');
  ['queued','running','blocked','done'].forEach(function(s){
    var col=el('div','col');col.appendChild(el('span','pill '+s,s+' '+by[s].length));
    by[s].forEach(function(a){var c=el('div','card');c.appendChild(el('h3',null,a.name));
      var bar=el('div','bar'),i=el('i');i.style.width=Math.max(0,Math.min(100,+a.progress||0))+'%';bar.appendChild(i);c.appendChild(bar);
      if(a.next)c.appendChild(el('p',null,'Next: '+a.next));if(a.owner)c.appendChild(el('p',null,a.owner));col.appendChild(c)});
    b.appendChild(col)});
  var ib=document.getElementById('ideas');
  open.forEach(function(i){var tr=el('tr');var td=el('td');td.appendChild(el('b',null,i.title));tr.appendChild(td);
    [i.area,i.impact,i.confidence,i.effort].forEach(function(v,k){tr.appendChild(el('td',k?'n':'',v))});tr.appendChild(el('td','s',i.score));ib.appendChild(tr)});
  var tb=document.getElementById('tasks');
  d.tasks.filter(function(t){return t.status!=='done'}).forEach(function(t){var tr=el('tr');[t.title,t.status,t.assignee,t.agent].forEach(function(v){tr.appendChild(el('td',null,v||''))});tb.appendChild(tr)});
  d.decisions.forEach(function(x){document.getElementById('dec').appendChild(el('li',null,x.title))});
}).catch(function(){document.getElementById('gen').textContent='Could not load data.json'});
</script>
</body>
</html>
