name: board
on:
  push:
    paths: ["board/**", "tasks/**", "scripts/board.py"]
permissions:
  contents: write
concurrency: board
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/board.py
      - name: Commit regenerated board
        run: |
          git config user.name "board-bot"; git config user.email "board-bot@users.noreply.github.com"
          git add BOARD.md site/data.json
          git diff --cached --quiet || (git commit -m "board: regenerate [skip ci]" && git push)
